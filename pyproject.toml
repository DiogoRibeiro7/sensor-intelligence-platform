[tool.poetry]
    name = "sensor-intelligence-platform"
    version = "0.1.0"
    description = "Forecasting and anomaly detection for sensor data."
    authors = ["Diogo Ribeiro <hansolo.dj@gmail.com>"]
    readme = "README.md"
    packages = [{ include = "sensor_intelligence", from = "src" }]

    [tool.poetry.dependencies]
    python = ">=3.11,<3.13"
pydantic = "^2.8.0"
typer = "^0.12.3"
rich = "^13.7.1"
numpy = "^1.26.4"
pandas = "^2.2.2"
scikit-learn = "^1.5.0"
scipy = "^1.13.1"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
matplotlib = "^3.9.0"
mlflow = "^3.11.0"
pyyaml = "^6.0.1"

    [tool.poetry.group.dev.dependencies]
    pytest = "^8.2.2"
    pytest-cov = "^5.0.0"
    mypy = "^1.10.1"
    ruff = "^0.5.0"
    pre-commit = "^3.7.1"
    nbval = "^0.11.0"
    jupyter = "^1.0.0"

    [build-system]
    requires = ["poetry-core"]
    build-backend = "poetry.core.masonry.api"

    [tool.ruff]
    line-length = 100
    target-version = "py311"

    [tool.ruff.lint]
    select = ["E", "F", "I", "B", "UP", "N", "ANN", "S", "C4", "SIM"]
    ignore = ["ANN101", "ANN102", "S101"]

    [tool.mypy]
    python_version = "3.11"
    strict = true
    warn_unused_ignores = true
    warn_return_any = true
    no_implicit_optional = true

    [tool.pytest.ini_options]
    testpaths = ["tests"]
    addopts = "--cov=src --cov-report=term-missing"
